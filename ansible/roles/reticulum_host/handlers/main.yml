---
- name: Restart reticulum services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    state: restarted
    daemon_reload: true
  loop: "{{ reticulum_host_services }}"
  when: not reticulum_host_image_build

- name: Reload sshd
  ansible.builtin.systemd_service:
    name: ssh
    state: reloaded
  when: not reticulum_host_image_build

- name: Reload the firewall
  ansible.builtin.systemd_service:
    name: reticulum-firewall.service
    state: restarted
    daemon_reload: true
  when: not reticulum_host_image_build and reticulum_host_firewall

- name: Restart gpsd
  ansible.builtin.systemd_service:
    name: gpsd
    state: restarted
  when: not reticulum_host_image_build

- name: Restart chrony
  ansible.builtin.systemd_service:
    name: chrony
    state: restarted
  when: not reticulum_host_image_build

- name: Reload nginx
  ansible.builtin.systemd_service:
    name: nginx
    state: reloaded
  when: not reticulum_host_image_build
