---
# True when building an image: services are enabled but not started, so no identity is created
reticulum_host_image_build: false

reticulum_host_user: reticulum
reticulum_host_home: /var/lib/reticulum
reticulum_host_rns_dir: "{{ reticulum_host_home }}/rns"
reticulum_host_retibbs_dir: "{{ reticulum_host_home }}/retibbs"
reticulum_host_rngit_dir: "{{ reticulum_host_home }}/rngit"
reticulum_host_partyline_dir: "{{ reticulum_host_home }}/partyline"
reticulum_host_nomadnet_dir: "{{ reticulum_host_home }}/nomadnet"
reticulum_host_lxmd_dir: "{{ reticulum_host_home }}/lxmd"

reticulum_host_install_dir: /opt/reticulum
reticulum_host_venv: "{{ reticulum_host_install_dir }}/venv"

reticulum_host_retibbs_repo: https://github.com/kc1awv/RetiBBS.git
reticulum_host_retibbs_version: 7c26d2c05e945f67382695d2f8de21abdb6d7020
reticulum_host_retibbs_checkout: "{{ reticulum_host_install_dir }}/RetiBBS"

# libopus0 and libogg0 are the Opus codec for partyline
reticulum_host_apt_packages: [git, ansible, python3-venv, sqlite3, ca-certificates, libopus0, libogg0, curl, wget]

# Commands from the venv linked into /usr/local/bin
reticulum_host_commands: [rnsd, rnstatus, rnpath, rnprobe, rncp, rnx, rnid, rnir, rnodeconf, rnsh, rnpkg, rngit,
                          rngcs, git-remote-rns, lxmd, nomadnet, partyline-server, partyline-client]

reticulum_host_enable_transport: true
reticulum_host_loglevel: 4
reticulum_host_tcp_server: true
reticulum_host_tcp_port: 4242
# Extra Reticulum interfaces: list of {name: "...", options: {type: ..., ...}}
reticulum_host_extra_interfaces: []

reticulum_host_bbs_name: Reticulum BBS
reticulum_host_bbs_announce_interval: 300
reticulum_host_bbs_theme: radio

# Partyline voice rooms; profiles: opus-high, opus-med, opus-low, c2-3200, c2-2400, c2-1200, c2-700, music-*
reticulum_host_partyline_name: Reticulum voice
reticulum_host_partyline_motd: Welcome. Be kind, keep it short on slow links.
reticulum_host_partyline_profile: opus-med
reticulum_host_partyline_max_members: 16
# Identity hashes of operators, who can kick, mute and move users
reticulum_host_partyline_ops: []
reticulum_host_partyline_rooms:
  - {name: Lobby, description: Open to everyone}
  - {name: Low bandwidth, profile: c2-1200, description: Codec2 for slow links}

# Nomad Network page node; pages go in /var/lib/reticulum/nomadnet/storage/pages
reticulum_host_nomadnet_node_name: Reticulum host
reticulum_host_nomadnet_announce_interval: 360

# LXMF propagation node (lxmd): holds LXMF messages, such as RetiBBS board alerts, for people who are offline.
# The storage limit is in megabytes. Autopeering copies messages to and from other propagation nodes up to the
# given number of hops away; turn it off, or lower the depth, on hosts whose only links are slow radio.
reticulum_host_lxmd_propagation: true
reticulum_host_lxmd_node_name: Reticulum host
reticulum_host_lxmd_announce_interval: 360
reticulum_host_lxmd_storage_limit: 500
reticulum_host_lxmd_autopeer: true
reticulum_host_lxmd_autopeer_maxdepth: 6

# Systemd units to enable; nomadnet is installed but not run by default
reticulum_host_services: [rnsd, retibbs, rngit, partyline, lxmd]

# Web page and file sharing: nginx serves a page with this host's addresses and the user guide, written at each boot,
# and one folder as a plain file list under /files/, read only. The folder is also shared by the Nomad Network page
# node. Off by default; the ISO and Pi image turn it on.
reticulum_host_http_files: false
reticulum_host_http_files_dir: /srv/reticulum-host/files
reticulum_host_web_dir: /srv/reticulum-host/www
reticulum_host_http_port: 80

# Answer to <hostname>.local on the local network (mDNS, avahi), so people can open the web page without knowing the
# host's IP address. Off by default; the ISO and Pi image turn it on.
reticulum_host_mdns: false

# Health page at /health.html beside the web page, rewritten every minute: time, GPS, power, disks, services and
# Reticulum interfaces. Only when the web page is on. The GPS position can be left off the page.
reticulum_host_health: true
reticulum_host_health_position: true
# More systemd units for the health page to report, such as those of the offgrid_suite role. Optional ones only run
# when something they need is there, such as Kiwix's library drive, so being stopped is not a problem.
reticulum_host_health_extra_units: []
reticulum_host_health_optional_units: []

# GPS (gpsd) and time (chrony): USB GPS receivers are used when plugged in; list other devices, such as a GPS board on
# a Raspberry Pi's serial pins, in reticulum_host_gps_devices: [/dev/serial0]. chrony replaces systemd-timesyncd, uses
# the GPS for time when there is no internet, and serves time to the local network. Off by default; the ISO and Pi
# image turn it on.
reticulum_host_gps: false
reticulum_host_gps_devices: []
reticulum_host_ntp_server: true

# Firewall (nftables): drop incoming traffic except SSH, Reticulum and network setup.
# Off by default so the role does not interfere with an existing firewall; the ISO and Pi image turn it on.
reticulum_host_firewall: false
reticulum_host_firewall_ssh: true
# More ports to open, for example a Reticulum UDPInterface: [{proto: udp, port: 4243}]
reticulum_host_firewall_extra_ports: []

# Show this host's Reticulum addresses in the console login banner, and in the SSH login banner
reticulum_host_banner: true
reticulum_host_ssh_banner: true
