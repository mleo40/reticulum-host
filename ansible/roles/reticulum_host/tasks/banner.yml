---
- name: Install the banner writer
  ansible.builtin.copy:
    src: reticulum-banner.py
    dest: "{{ reticulum_host_install_dir }}/bin/"
    mode: "0755"

- name: Create the console banner folder
  ansible.builtin.file:
    path: /etc/issue.d
    state: directory
    mode: "0755"

- name: Install the banner unit
  ansible.builtin.template:
    src: reticulum-banner.service.j2
    dest: /etc/systemd/system/reticulum-banner.service
    mode: "0644"

- name: Enable the banner unit
  ansible.builtin.systemd_service:
    name: reticulum-banner.service
    enabled: true
    daemon_reload: true

- name: Point SSH at the banner
  ansible.builtin.copy:
    content: "Banner /etc/ssh/reticulum-banner\n"
    dest: /etc/ssh/sshd_config.d/reticulum-banner.conf
    mode: "0644"
  when: reticulum_host_ssh_banner
  notify: Reload sshd

- name: Write the banners now
  ansible.builtin.systemd_service:
    name: reticulum-banner.service
    state: started
  when: not reticulum_host_image_build
