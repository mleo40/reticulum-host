---
- name: Install nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Create the shared files folder
  ansible.builtin.file:
    path: "{{ reticulum_host_http_files_dir }}"
    state: directory
    mode: "0755"

- name: Create the web page folder
  ansible.builtin.file:
    path: "{{ reticulum_host_web_dir }}"
    state: directory
    mode: "0755"

- name: Install the user guide shown on the web page
  ansible.builtin.copy:
    src: user-guide.md
    dest: "{{ reticulum_host_install_dir }}/share/"
    mode: "0644"

- name: Add a page shown until the first boot writes the real one
  ansible.builtin.copy:
    content: |
      <!doctype html>
      <html lang="en"><head><meta charset="utf-8"><meta http-equiv="refresh" content="15">
      <title>Reticulum host</title></head>
      <body><p>The host is starting. This page shows its addresses within two minutes.</p></body></html>
    dest: "{{ reticulum_host_web_dir }}/index.html"
    mode: "0644"
    force: false

- name: Share the folder through the Nomad Network page node too
  ansible.builtin.file:
    src: "{{ reticulum_host_http_files_dir }}"
    dest: "{{ reticulum_host_nomadnet_dir }}/storage/files/shared"
    state: link
    force: true

- name: Write the web site
  ansible.builtin.template:
    src: nginx-files.conf.j2
    dest: /etc/nginx/sites-available/reticulum-files
    mode: "0644"
  notify: Reload nginx

- name: Enable the web site
  ansible.builtin.file:
    src: /etc/nginx/sites-available/reticulum-files
    dest: /etc/nginx/sites-enabled/reticulum-files
    state: link
  notify: Reload nginx

- name: Remove the nginx welcome site
  ansible.builtin.file:
    path: /etc/nginx/sites-enabled/default
    state: absent
  notify: Reload nginx

- name: Enable nginx
  ansible.builtin.systemd_service:
    name: nginx
    enabled: true

- name: Start nginx
  ansible.builtin.systemd_service:
    name: nginx
    state: started
  when: not reticulum_host_image_build
