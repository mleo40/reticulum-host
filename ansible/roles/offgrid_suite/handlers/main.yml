---
- name: Restart Kiwix
  ansible.builtin.systemd_service:
    name: kiwix
    state: restarted
    daemon_reload: true
  when: not reticulum_host_image_build

- name: Restart the check-in bot
  ansible.builtin.systemd_service:
    name: offgrid-checkin
    state: restarted
    daemon_reload: true
  when: not reticulum_host_image_build
